name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare runner native libs
        run: |
          New-Item -ItemType Directory -Force engine/modules/quickjs/prebuilt/jvm/windows-x86_64 | Out-Null
          Copy-Item engine/runner/native/legado_quickjs.dll engine/modules/quickjs/prebuilt/jvm/windows-x86_64/

      - name: Runner smoke (offline rules)
        run: |
          cd engine
          ./gradlew.bat -g "${{ runner.temp }}/gradle-home" "-Porg.gradle.java.installations.paths=$env:JAVA_HOME_17_X64,$env:JAVA_HOME_21_X64" :runner:run

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Build engine AAR
        run: |
          chmod +x engine/gradlew
          cd engine
          ./gradlew -g "$RUNNER_TEMP/gradle-home" :runner:compileKotlin publishAllPublicationsToLocalRepo

      - name: Build Rust pagination library
        run: |
          rustup target add aarch64-linux-android
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          cd native
          cargo build --release --target aarch64-linux-android
          cp target/aarch64-linux-android/release/libbook_pager.so \
            ../android/app/src/main/jniLibs/arm64-v8a/libbook_pager.so

      - name: Write release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64. Add the four signing secrets described in docs/SIGNING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/langhuan-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=langhuan-release.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --concurrency=1

      - name: Build arm64 release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: |
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d '\r')"
          echo "APK_VERSION=$version" >> "$GITHUB_ENV"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "build/app/outputs/flutter-apk/langhuan-${version}-arm64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: langhuan-${{ env.APK_VERSION }}-arm64
          path: build/app/outputs/flutter-apk/langhuan-${{ env.APK_VERSION }}-arm64.apk
          if-no-files-found: error
          retention-days: 14
