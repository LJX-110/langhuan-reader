name: Preview APK

on:
  push:
    tags:
      - 'preview-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build arm64 debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: P3 预览
          prerelease: true
          body: |
            琅嬛阁 P3 预览，arm64 debug APK。

            - 阅读器菜单拆分、两端对齐 / 左对齐、章内查找
            - 搜索页与暗色副文本修复
            - 仅用于真机预览，未完成正式验收
            - 安装时如提示未知来源，请允许
          files: build/app/outputs/flutter-apk/app-debug.apk
