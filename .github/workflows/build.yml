name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug and release
        run: |
          chmod +x gradlew
          ./gradlew assembleAppDebug assembleAppRelease \
            --parallel --build-cache --warning-mode all

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: langhuan-apk
          path: app/build/outputs/apk/app/**/*.apk
          if-no-files-found: error
