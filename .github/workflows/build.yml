name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 打 tag 要创建 Release, 需要写 contents 权限
permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # build-logic 与 quickjs-processor 的 toolchain 固定 17, 与主 JDK 21 并存
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # tag 推送时把 vX.Y.Z 注入 -PappVersion, 包内版本号与 tag 一致;
      # 普通分支构建留空, 走 app/build.gradle.kts 的默认基线版本
      - name: Resolve app version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION_ARG=-PappVersion=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      # 复用仓库已有的签名 Secrets, 仓库里不落任何密钥文件
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "缺少 ANDROID_KEYSTORE_BASE64, 无法生成正式签名包"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # 调试包做编译校验, 不进 Release (签名用默认 debug key)
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --parallel --build-cache --warning-mode all \
            $APP_VERSION_ARG

      # 只出 arm64-v8a 单包: 已开 R8 + 资源裁剪
      - name: Build release APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleAppRelease --parallel --build-cache --warning-mode all \
            -PRELEASE_STORE_FILE="$RUNNER_TEMP/release.jks" \
            -PRELEASE_STORE_PASSWORD="$STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD" \
            $APP_VERSION_ARG

      # 推 v* 标签才发版, 平时 build 只做校验
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/app/release/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
