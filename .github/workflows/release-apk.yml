name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches pubspec version
        run: |
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d '\r')"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$'; then
            echo "::error::pubspec.yaml version must look like 1.2.3+4, got '$version'"
            exit 1
          fi
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version v$version"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Build engine AAR
        run: |
          chmod +x engine/gradlew
          cd engine
          ./gradlew -g "$RUNNER_TEMP/gradle-home" :runner:compileKotlin publishAllPublicationsToLocalRepo

      - name: Build Rust pagination library
        run: |
          rustup target add aarch64-linux-android
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          cd native
          cargo build --release --target aarch64-linux-android
          cp target/aarch64-linux-android/release/libbook_pager.so \
            ../android/app/src/main/jniLibs/arm64-v8a/libbook_pager.so

      - name: Write release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64. Add the four signing secrets described in docs/SIGNING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/langhuan-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=langhuan-release.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --concurrency=1

      - name: Build arm64 release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/langhuan-${GITHUB_REF_NAME}-arm64.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 琅嬛阁 ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          body: |
            琅嬛阁 ${{ github.ref_name }}，arm64 release APK，使用项目自有 keystore 签名。

            - 书源由使用者自行维护，应用不内置任何书源
            - 安装时如提示未知来源，请允许
          files: build/app/outputs/flutter-apk/langhuan-${{ github.ref_name }}-arm64.apk
