name: langhuan
description: 琅嬛阁 — 个人自用的 Flutter 网络小说阅读器。
publish_to: 'none'
version: 2.3.2+16

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  fluro: ^2.0.5
  event_bus: ^2.0.1
  sqflite: ^2.4.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.3
  flutter_cache_manager: ^3.4.1
  scrollable_positioned_list: ^0.3.8
  json_annotation: ^4.9.0
  url_launcher: ^6.3.1
  readmore: ^3.0.0
  intl: ^0.20.2
  ffi: ^2.1.4
  path: ^1.9.1
  # GBK / Big5 本地 TXT 导入
  fast_gbk: ^1.0.0
  extended_image: ^10.1.0
  file_picker: ^11.0.2
  package_info_plus: ^9.0.1
  connectivity_plus: ^7.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  sqflite_common_ffi: ^2.4.5

# Transitive pins that break Dart 3.12 / AGP 9 builds
dependency_overrides:
  platform: ^3.1.6

flutter:
  uses-material-design: true
  assets:
    # Bundled CJK face for reader + Rust book_pager (ABI v3 shared font_path).
    - assets/fonts/HarmonyOS_Sans_SC_Regular.ttf
  fonts:
    - family: HarmonyOSSansSC
      fonts:
        - asset: assets/fonts/HarmonyOS_Sans_SC_Regular.ttf
